name: Build plugin catalog

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tools/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:

# Lets the job push the dist branch with the built-in token (also set Workflow permissions to read and write in repo settings)
permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips and index.json
        run: python3 tools/build_catalog.py

      # dist is published as a single commit branch that is force pushed each time
      # so the zips never pile up in history and main never contains built files
      - name: Publish dist branch
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catalog built from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
